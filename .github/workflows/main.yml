name: Run Taito Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          WEBHOOK_URL_Taito: ${{ secrets.WEBHOOK_URL_Taito }}
        run: python check_taito.py
