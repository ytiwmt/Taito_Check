name: Taito Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps

      - name: Run script
        env:
          WEBHOOK_URL_Taito: ${{ secrets.WEBHOOK_URL_Taito }}
        run: |
          python check_taito.py
